services:
  postgres:
    image: postgres:16
    container_name: school-grievance-postgres
    # Development-only credentials; keep the published port on loopback.
    environment:
      POSTGRES_DB: school_grievances
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
